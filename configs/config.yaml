defaults:
  - bbox_trajectory: default
  - feature_extractor: osnet
  - person_detector: accurate
  - person_tracker: accurate
  - pose_estimator: vitpose
  - position_estimator: default
  - registration_pipeline: default
  - source: video
  - target_classifier: ridge
  - target_matching: default
  - target_tracker: default
  - tracking_pipeline: default
  - _self_

device: cuda:0

paths:
  root: ${hydra:runtime.cwd}
  models_dir: ${paths.root}/models
  inputs_dir: ${paths.root}/inputs

target:
  name: ??? # Name of the person to track
  directory: ${paths.inputs_dir}/target/${.name}

results:
  directory: ${paths.root}/results/${now:%Y-%m-%d-%H-%M-%S}-${source.name}-${target.name}

  crops:
    path: ${results.directory}/crops

  bbox:
    enabled: true
    path: ${results.directory}/bbox.pt

  video:
    enabled: true
    path: ${results.directory}/tracking.mp4

  debug_video:
    enabled: true
    path: ${results.directory}/debug.mp4

  display:
    enabled: true
    window_name: Target Tracking
