defaults:
  - _self_

device: cuda:0

paths:
  root: ${hydra:runtime.cwd}
  input_dir: ${paths.root}/inputs
  model_dir: ${paths.root}/models
  result_dir: ${paths.root}/results

video:
  name: trampolin2
  input_path: ${paths.input_dir}/${video.name}.mp4
  output_path: ${paths.result_dir}/tracking_${video.name}.mp4

target:
  name: target_${video.name}
  image_dir: ${paths.input_dir}/${target.name}
  crop_dir: ${paths.result_dir}/${target.name}_crops

bbox:
  path: ${paths.result_dir}/${video.name}_bbox.pt
  enabled: true

detector:
  _target_: target_detector.TargetDetector
  model_path: ${paths.model_dir}/yolo/yolo26l.pt
  confidence: 0.5
  device: ${device}

person_feature_extractor:
  _target_: person_feature_extractor.PersonFeatureExtractor
  model_name: osnet_ain_x1_0
  model_path: ${paths.model_dir}/osnet/osnet_ain_x1_0_msmt17_256x128_amsgrad_ep50_lr0.0015_coslr_b64_fb10_softmax_labsmth_flip_jitter.pth
  device: ${device}

positive_memory:
  _target_: feature_memory.FeatureMemory
  feature_dim: 512
  short_term_capacity: 100
  long_term_capacity: 500
  device: ${device}

negative_memory:
  _target_: feature_memory.FeatureMemory
  feature_dim: 512
  short_term_capacity: 1000
  long_term_capacity: 3000
  device: ${device}

target_gallery_matcher:
  _target_: target_gallery_matcher.TargetGalleryMatcher
  threshold: 0.65
  top_k: 3
  device: ${device}

person_tracker:
  _target_: person_tracker.PersonTracker
  model_path: ${paths.model_dir}/yolo/yolo26l.pt
  tracker_config: ${paths.root}/configs/trackers/botsort_custom.yaml
  confidence: 0.25
  image_size: 1280
  device: ${device}

target_classifier:
  _target_: target_classifier.TargetClassifier
  feature_dim: 512
  update_steps: 50
  learning_rate: 1e-3
  weight_decay: 1e-4
  threshold: 0.65
  device: ${device}
  
tracking_pipeline:
  _target_: target_tracking_pipeline.TargetTrackingPipeline
  config:
    _target_: target_tracking_pipeline.TrackingPipelineConfig
    reid_keep_threshold: 0.35
    reid_reject_threshold: 0.25
    reid_validation_interval: 5
    reid_validation_tolerance: 2
    lost_tolerance: 20
    velocity_smoothing: 0.65
    velocity_decay: 0.9
    classifier_collect_interval: 1
    classifier_max_overlap_iou: 0.2
    min_negatives: 30
    min_positives: 20
